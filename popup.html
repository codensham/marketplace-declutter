<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Marketplace Declutter</title>
    <style>
      :root {
        color-scheme: light dark;
        --muted: #65676b;
        --line: #ced0d4;
        --error: #c0392b;
        --surface: #fff;
        --active: #e7f3ff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --muted: #b0b3b8;
          --line: #3e4042;
          --error: #ff6b5e;
          --surface: #242526;
          --active: #263951;
        }
      }
      body {
        width: 280px;
        margin: 0;
        padding: 14px;
        font: 13px/1.4 system-ui, sans-serif;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 14px;
      }
      label {
        display: block;
        margin-bottom: 10px;
      }
      label.check {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      label span {
        display: block;
        margin-bottom: 3px;
        color: var(--muted);
      }
      input[type='text'],
      button {
        margin: 0 0 12px;
        padding: 5px 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      .field {
        position: relative;
        margin-bottom: 10px;
      }
      .field label {
        margin-bottom: 0;
      }
      .field input[type='text'] {
        box-sizing: border-box;
        width: 100%;
        margin: 0;
        cursor: text;
      }
      #suggestions {
        position: absolute;
        z-index: 1;
        top: 100%;
        left: 0;
        right: 0;
        margin: 2px 0 0;
        padding: 4px;
        list-style: none;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface);
        box-shadow: 0 4px 12px rgb(0 0 0 / 0.18);
      }
      #suggestions li {
        padding: 5px 8px;
        border-radius: 4px;
        cursor: pointer;
      }
      #suggestions li[aria-selected='true'] {
        background: var(--active);
      }
      #source {
        margin: -4px 0 10px;
        color: var(--muted);
      }
      input[type='number'] {
        box-sizing: border-box;
        width: 100%;
        padding: 6px 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
        font: inherit;
      }
      #status {
        min-height: 18px;
        color: var(--error);
      }
      #status.hint {
        color: var(--muted);
      }
      #counts {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid var(--line);
        color: var(--muted);
      }
      footer {
        margin-top: 10px;
        font-size: 11px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <h1>Marketplace Declutter</h1>

    <label class="check"><input type="checkbox" id="enabled" /> Enabled</label>

    <div class="field">
      <label>
        <span>City</span>
        <input
          type="text"
          id="city"
          placeholder="Start typing a city"
          autocomplete="off"
          role="combobox"
          aria-autocomplete="list"
          aria-expanded="false"
          aria-controls="suggestions"
        />
      </label>
      <ul id="suggestions" role="listbox" hidden></ul>
    </div>

    <label>
      <span>Radius (miles)</span>
      <input type="number" id="radius" min="1" max="500" step="1" />
    </label>

    <div id="source"></div>
    <button type="button" id="useFacebook" hidden>Use Facebook's location</button>

    <label class="check"><input type="checkbox" id="hideShipping" /> Hide shipping-only</label>
    <label class="check"><input type="checkbox" id="hideAds" /> Hide ads from sellers</label>

    <div id="status" role="status"></div>
    <div id="counts"></div>

    <footer>City data: GeoNames (CC BY 4.0) and US Census Bureau.</footer>

    <script src="lib/geo.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
