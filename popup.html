<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Marketplace Declutter</title>
    <style>
      :root {
        color-scheme: light dark;
        --amber: #ef9f27;
        --brown: #412402;
        --brown-2: #633806;
        --cream: #faeeda;
        --text: #1c1e21;
        --muted: #65676b;
        --line: #e4e6eb;
        --surface: #ffffff;
        --hero-bg: var(--cream);
        --hero-fg: var(--brown);
        --hero-fg-2: var(--brown-2);
        --eye: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z'/><circle cx='12' cy='12' r='3'/></svg>");
        --eye-off: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z'/><circle cx='12' cy='12' r='3'/><path d='M3 3l18 18'/></svg>");
        --power: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.4' stroke-linecap='round'><path d='M12 3v8'/><path d='M6.3 7.5a8 8 0 1 0 11.4 0'/></svg>");
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #e4e6eb;
          --muted: #b0b3b8;
          --line: #3e4042;
          --surface: #242526;
          --hero-bg: #412402;
          --hero-fg: #fac775;
          --hero-fg-2: #faeeda;
        }
      }
      body {
        width: 340px;
        margin: 0;
        background: var(--surface);
        color: var(--text);
        font: 13px/1.4 system-ui, sans-serif;
      }
      :focus-visible {
        outline: 2px solid var(--amber);
        outline-offset: 2px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
      }
      header img {
        width: 24px;
        height: 24px;
      }
      h1 {
        flex: 1;
        margin: 0;
        font-size: 15px;
        font-weight: 600;
      }
      /* Checkboxes drawn as buttons; popup.js reads .checked as before. */
      .power,
      .eye {
        appearance: none;
        position: relative;
        flex: none;
        margin: 0;
        border: 1px solid var(--line);
        background: transparent;
        cursor: pointer;
      }
      .power {
        width: 30px;
        height: 30px;
        border-radius: 50%;
      }
      .eye {
        width: 28px;
        height: 28px;
        border-radius: 8px;
      }
      .power::after,
      .eye::after {
        content: '';
        position: absolute;
        inset: 6px;
        background: var(--muted);
        -webkit-mask: var(--eye) center / contain no-repeat;
        mask: var(--eye) center / contain no-repeat;
      }
      .power::after {
        -webkit-mask-image: var(--power);
        mask-image: var(--power);
      }
      .power:checked,
      .eye:checked {
        border-color: var(--amber);
        background: var(--amber);
      }
      .power:checked::after,
      .eye:checked::after {
        background: var(--brown);
      }
      .eye:checked::after {
        -webkit-mask-image: var(--eye-off);
        mask-image: var(--eye-off);
      }
      .hero {
        display: flex;
        align-items: baseline;
        gap: 6px;
        margin: 0 16px 12px;
        padding: 12px 14px;
        border-radius: 10px;
        background: var(--hero-bg);
        color: var(--hero-fg-2);
      }
      #total {
        color: var(--hero-fg);
        font-size: 26px;
        font-weight: 600;
        line-height: 1;
      }
      .sec {
        padding: 10px 16px;
        border-top: 1px solid var(--line);
      }
      .lbl {
        margin: 0 0 4px;
        color: var(--muted);
        font-size: 12px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 36px;
        cursor: pointer;
      }
      .ct {
        margin-left: auto;
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }
      .note {
        margin: 0 0 2px 38px;
        color: var(--muted);
        font-size: 12px;
      }
      .price {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .price input {
        width: 70px;
        min-width: 0;
        padding: 4px 6px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
      }
      .help {
        margin: 6px 0 0;
        color: var(--muted);
      }
      button {
        padding: 4px 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      .link {
        padding: 0;
        border: 0;
        color: inherit;
        font-size: inherit;
        text-decoration: underline dotted;
      }
      #unknownBox,
      #farBox {
        margin: 2px 0 4px 38px;
        color: var(--muted);
      }
      #unknownList,
      #farList {
        max-height: 120px;
        overflow-y: auto;
        margin: 0 0 6px;
        padding-left: 18px;
      }
      #farList li {
        display: flex;
        gap: 8px;
      }
      #farList .miles {
        margin-left: auto;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      body.off .hero,
      body.off .sec {
        opacity: 0.5;
      }
      footer {
        padding: 10px 16px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 11px;
      }
      footer .privacy {
        display: flex;
        align-items: center;
        gap: 5px;
        margin-bottom: 2px;
        font-size: 12px;
      }
      footer svg {
        width: 13px;
        height: 13px;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="icons/icon48.png" alt="" />
      <h1>Marketplace Declutter</h1>
      <input type="checkbox" id="enabled" class="power" role="switch" aria-label="Filtering on" title="Turn filtering on or off" />
    </header>

    <div class="hero" role="status">
      <span id="total">–</span>
      <span id="heroText">Open Facebook Marketplace to see counts</span>
    </div>

    <section class="sec" aria-labelledby="areaLbl">
      <p class="lbl" id="areaLbl">Area · from Facebook</p>
      <label class="row">
        <input type="checkbox" id="hideFar" class="eye" aria-label="Hide listings outside your area" />
        <span id="source"></span>
        <span class="ct" id="farCount"></span>
      </label>
      <div id="farBox" hidden>
        <ul id="farList"></ul>
      </div>
      <p class="note" id="graceNote"></p>
    </section>

    <section class="sec" aria-labelledby="listLbl">
      <p class="lbl" id="listLbl">Listings</p>
      <label class="row">
        <input type="checkbox" id="hideShipping" class="eye" aria-label="Hide shipping-only listings" />
        <span>Shipping-only</span>
        <span class="ct" id="shipCount"></span>
      </label>
      <label class="row">
        <input type="checkbox" id="hideAds" class="eye" aria-label="Hide seller ads" />
        <span>Seller ads</span>
        <span class="ct" id="adCount"></span>
      </label>
      <label class="row">
        <input type="checkbox" id="hideUnknown" class="eye" aria-label="Hide listings with an unknown city" />
        <span>Unknown cities</span>
        <span class="ct" id="unknownCount"></span>
      </label>
      <div id="unknownBox" hidden>
        <ul id="unknownList"></ul>
        <button type="button" id="copyUnknown">Copy</button>
      </div>
    </section>

    <section class="sec" aria-labelledby="priceLbl">
      <p class="lbl" id="priceLbl">Price</p>
      <div class="price">
        <input type="number" id="priceMin" min="0" step="1" placeholder="$ min" inputmode="numeric" aria-label="Minimum price" />
        <span>to</span>
        <input type="number" id="priceMax" min="0" step="1" placeholder="$ max" inputmode="numeric" aria-label="Maximum price" />
        <span class="ct" id="priceCount"></span>
      </div>
      <p id="priceHint" class="help" role="status" hidden>Min is above max. Fix one to apply the range.</p>
    </section>

    <footer>
      <div class="privacy">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <rect x="5" y="11" width="14" height="10" rx="2" />
          <path d="M8 11V7a4 4 0 0 1 8 0v4" />
        </svg>
        Runs only in your browser · Free
      </div>
      City data: GeoNames (CC BY 4.0) and US Census Bureau.
    </footer>

    <script src="lib/geo.js"></script>
    <script src="lib/listing.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
