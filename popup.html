<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Marketplace Declutter</title>
    <style>
      :root {
        color-scheme: light dark;
        --muted: #65676b;
        --line: #ced0d4;
        --error: #c0392b;
        --surface: #fff;
        --active: #e1f5ee;
        --brand: #0f6e56;
        --on: #1d9e75;
        --off: #b0b3b8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --muted: #b0b3b8;
          --line: #3e4042;
          --error: #ff6b5e;
          --surface: #242526;
          --active: #1d4a3f;
          --brand: #5dcaa5;
          --off: #5a5c5f;
        }
      }
      body {
        width: 280px;
        margin: 0;
        padding: 14px;
        font: 13px/1.4 system-ui, sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 14px;
      }
      header img {
        width: 20px;
        height: 20px;
      }
      h1 {
        flex: 1;
        margin: 0;
        font-size: 14px;
        font-weight: 600;
      }
      /* The on/off switch is a checkbox, so popup.js reads it as before. */
      .switch {
        appearance: none;
        position: relative;
        flex: none;
        width: 32px;
        height: 18px;
        margin: 0;
        border-radius: 9px;
        background: var(--off);
        cursor: pointer;
        transition: background 0.15s;
      }
      .switch::after {
        content: '';
        position: absolute;
        top: 2px;
        left: 2px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #fff;
        transition: transform 0.15s;
      }
      .switch:checked {
        background: var(--on);
      }
      .switch:checked::after {
        transform: translateX(14px);
      }
      .field {
        position: relative;
        margin-bottom: 10px;
      }
      .field label {
        display: block;
      }
      .field span {
        display: block;
        margin-bottom: 3px;
        color: var(--muted);
      }
      .field input {
        box-sizing: border-box;
        width: 100%;
        padding: 6px 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--on);
        outline-offset: 1px;
      }
      #suggestions {
        position: absolute;
        z-index: 1;
        top: 100%;
        left: 0;
        right: 0;
        margin: 2px 0 0;
        padding: 4px;
        list-style: none;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface);
        box-shadow: 0 4px 12px rgb(0 0 0 / 0.18);
      }
      #suggestions li {
        padding: 5px 8px;
        border-radius: 4px;
        cursor: pointer;
      }
      #suggestions li[aria-selected='true'] {
        background: var(--active);
      }
      .source {
        display: flex;
        align-items: flex-start;
        gap: 5px;
        color: var(--muted);
      }
      .source svg {
        flex: none;
        width: 14px;
        height: 14px;
        margin-top: 2px;
        color: var(--brand);
      }
      button {
        margin-top: 8px;
        padding: 5px 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      #status {
        margin-top: 8px;
        color: var(--error);
      }
      #status:empty {
        display: none;
      }
      hr {
        margin: 12px 0;
        border: 0;
        border-top: 1px solid var(--line);
      }
      label.check {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 3px 0;
        cursor: pointer;
      }
      label.check input {
        width: 15px;
        height: 15px;
        margin: 0;
        accent-color: var(--on);
      }
      #counts {
        color: var(--muted);
      }
      .link {
        margin: 0;
        padding: 0;
        border: 0;
        color: inherit;
        text-decoration: underline dotted;
      }
      #unknownBox {
        margin-top: 6px;
        color: var(--muted);
      }
      #unknownList {
        max-height: 120px;
        overflow-y: auto;
        margin: 0 0 6px;
        padding-left: 18px;
      }
      #copyUnknown {
        margin-top: 0;
      }
      footer {
        margin-top: 10px;
        font-size: 11px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <header>
      <img src="icons/icon48.png" alt="" />
      <h1>Marketplace Declutter</h1>
      <input type="checkbox" id="enabled" class="switch" role="switch" aria-label="Enabled" />
    </header>

    <div class="field">
      <label>
        <span>City</span>
        <input
          type="text"
          id="city"
          placeholder="Start typing a city"
          autocomplete="off"
          role="combobox"
          aria-autocomplete="list"
          aria-expanded="false"
          aria-controls="suggestions"
        />
      </label>
      <ul id="suggestions" role="listbox" hidden></ul>
    </div>

    <div class="field">
      <label>
        <span>Radius (miles)</span>
        <input type="number" id="radius" min="1" max="500" step="1" />
      </label>
    </div>

    <div class="source">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M12 21s-7-6.1-7-11a7 7 0 0 1 14 0c0 4.9-7 11-7 11z" stroke-linejoin="round" />
        <circle cx="12" cy="10" r="2.5" />
      </svg>
      <span id="source"></span>
    </div>
    <button type="button" id="useFacebook" hidden>Use Facebook's location</button>
    <div id="status" role="status"></div>

    <hr />

    <label class="check"><input type="checkbox" id="hideShipping" /> Hide shipping-only</label>
    <label class="check"><input type="checkbox" id="hideAds" /> Hide ads from sellers</label>
    <label class="check"><input type="checkbox" id="hideUnknown" /> Hide unknown cities</label>

    <hr />

    <div id="counts"></div>
    <div id="unknownBox" hidden>
      <ul id="unknownList"></ul>
      <button type="button" id="copyUnknown">Copy</button>
    </div>

    <footer>City data: GeoNames (CC BY 4.0) and US Census Bureau.</footer>

    <script src="lib/geo.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
